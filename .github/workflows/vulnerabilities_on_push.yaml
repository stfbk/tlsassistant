name: Vulnerability Scan on Push

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - develop

jobs:
  download_vuln_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download Vulnerability Scanner Image
        run: |
          docker pull ghcr.io/stfbk/tlsassistant-testbed:v2.0.1

      - name: Start Vulnerable Webserver
        run: |
          docker run --rm -d --network host \
            ghcr.io/stfbk/tlsassistant-testbed:v2.0.1
        
      - name: Run Vulnerability Scan
        run: |
          python3 tests/vulnerability_test.py
