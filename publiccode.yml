  en:
    shortDescription: Analyze TLS implementations to identify vulnerabilities and
      assess compliance levels, and recommend the necessary mitigations to
      resolve the issues
    longDescription: >-
      TLSAssistant is a research tool developed to assist system administrators
      and iOS/Android developers working on TLS implementations. It allows users
      to analyze web servers (locally or remotely) and iOS/Android apps to
      assess their security status and identify all TLS vulnerabilities that
      could be exploited to compromise the security of data transmissions.

      TLSAssistant can also verify the degree of compliance of an implementation
      with a set of national and supranational guidelines.


      The strength of TLSAssistant lies in its ability to generate an actionable
      report that lists existing misconfigurations, explains their impact, and
      provides step-by-step guidance on how to resolve them.

      ​The mitigation strategies were compiled by extracting information from
      scientific literature and technical manuals provided by each vendor.
    documentation: https://github.com/stfbk/tlsassistant/wiki
    features:
      - TLS vulnerability analysis for Apache and Nginx webservers, iOS and
        Android Apps
      - TLS compliance analysis for Apache and Nginx webservers
      - Actionable reports containing copy-and-paste code snippets to address
        the detected issues
