[tool.poetry]
package-mode = false
name = "tlsassistant"
version = "3.1.0"
description = "An open-source modular framework capable of identifying a wide range of TLS vulnerabilities and assessing compliance with multiple guidelines. Its actionable report can assist the user in correctly and easily fixing their configurations."
authors = ["Security And Trust Unit, Center for Cybersecurity, Fondazione Bruno Kessler"]
license = "Apache License 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
aiohttp = "=3.13.5"
tldextract = "=5.3.1"
apacheconfig = "=0.3.2"
crossplane = "=0.5.8"
cryptography = "=46.0.6"
tlslite-ng = "=0.9.0b2"
jsonmerge = "=1.9.2"
markdown2 = "=2.5.5"
Jinja2 = "=3.1.6"
stix2 = "=3.0.2"
stix2-patterns = "=2.1.2"
beautifulsoup4 = "=4.14.3"
pyasn1 = "=0.6.3"
async-timeout = "=5.0.1"
idna = "=3.11"
pyopenssl = "=26.0.0"
requests = "=2.33.1"
setuptools = "=80.10.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
